<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}To-Do App{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>To-Do List</h1>
        {% if user.is_authenticated %}
            <p>Bonjour, {{ user.username }} | <a href="{% url 'logout' %}">Déconnexion</a></p>
        {% endif %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
